<!doctype html><html lang="en"><meta name="viewport" content="width=device-width"><title>EduMate offline</title><style>body{font:18px system-ui;max-width:700px;margin:70px auto;padding:24px;color:#102a43;background:#f5f8fc}article{background:white;padding:30px;border-radius:20px;white-space:pre-wrap}button{padding:12px;background:#1456a0;color:white;border:0;border-radius:10px}</style><h1>EduMate Ghana</h1><p>Downloaded lessons • Offline reading</p><p>Use the same tablet account that downloaded these lessons. Sign in online to switch accounts.</p><main id="lessons"></main><article id="reader">Choose a downloaded lesson.</article><script>const r=indexedDB.open('edumate-reading',1);r.onupgradeneeded=()=>r.result.createObjectStore('lessons',{keyPath:'id'});r.onsuccess=()=>{const account=localStorage.getItem('edumate-reader');if(!account)return;const q=r.result.transaction('lessons').objectStore('lessons').getAll();q.onsuccess=()=>q.result.filter(x=>x.owner===account).forEach(x=>{const b=document.createElement('button');b.textContent=x.title;b.onclick=()=>document.getElementById('reader').textContent=x.content;document.getElementById('lessons').append(b);});};</script></html>
