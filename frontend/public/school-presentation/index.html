:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#112d42;background:#f1f6f6}*{box-sizing:border-box}body{margin:0}button,a{font:inherit}button{cursor:pointer} .shell{min-height:100dvh;display:flex;flex-direction:column}.top{height:76px;display:flex;align-items:center;justify-content:space-between;padding:0 5vw;background:#fff;border-bottom:1px solid #dce9e8;gap:15px}.brand{display:flex;gap:12px;align-items:center;color:#0c2943;font-weight:800;letter-spacing:-.04em;font-size:22px}.mark{width:38px;height:38px;display:grid;place-items:center;background:#15589d;color:white;border-radius:12px;font-size:19px}.brand small{display:block;color:#178877;letter-spacing:.18em;font-size:9px}.topright{display:flex;align-items:center;gap:20px;font-size:13px;color:#657c89}.topright a{color:#135a98;text-decoration:none;font-weight:700}.frame{flex:1;display:flex;align-items:center;justify-content:center;padding:28px 5vw 18px}.slide{width:min(1200px,100%);min-height:min(630px,calc(100dvh - 185px));border-radius:28px;background:white;box-shadow:0 18px 58px #183d4715;position:relative;overflow:hidden;display:flex;flex-direction:column;padding:clamp(28px,5vw,70px)}.slide:before{content:"";position:absolute;left:0;top:0;height:100%;width:8px;background:#1a9986}.slide.dark{color:white;background:#102a43}.slide.dark:before{background:#48c4a6}.kicker{text-transform:uppercase;letter-spacing:.18em;color:#168b78;font-size:12px;font-weight:800;margin-bottom:20px}.dark .kicker{color:#70dbc2}.slide h1{font-size:clamp(36px,4.5vw,61px);line-height:1.09;letter-spacing:-.045em;max-width:950px;margin:0}.slide h1.hero{font-size:clamp(48px,6vw,78px);max-width:750px}.lede{max-width:850px;font-size:clamp(17px,1.8vw,21px);line-height:1.55;color:#5f7685;margin:20px 0 0}.dark .lede{color:#c6d8df}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(18px,3vw,38px);margin-top:auto;padding-top:45px;padding-bottom:35px}.item{border-left:4px solid #1a9986;padding-left:19px;min-width:0}.item:nth-child(1){border-color:#15589d}.item:nth-child(3){border-color:#eeb842}.item h2{font-size:clamp(19px,2vw,24px);margin:0 0 13px;color:#102a43}.item p{font-size:clamp(15px,1.5vw,18px);line-height:1.55;color:#5b7381;margin:0}.note{font-size:15px;color:#1c4c47;margin:0 0 10px}.pill{display:inline-flex;align-self:flex-start;background:#d7f2e9;color:#0b765e;padding:10px 15px;border-radius:30px;font-weight:700;font-size:13px;margin-top:30px}.dark .pill{background:#22594e;color:#d5fff3}.cover-bottom{margin-top:auto;padding-top:40px;color:#adc6d2}.cover-art{position:absolute;right:8%;bottom:12%;width:250px;height:350px;background:#edf7f7;border:12px solid #d6ebe9;border-radius:24px;transform:rotate(5deg);padding:23px;color:#10334c;box-shadow:0 25px 55px #0002}.cover-art b{display:block;background:#175d9e;color:white;border-radius:7px;padding:9px;font-size:12px}.cover-art h3{margin:26px 0 15px}.cover-art span{display:block;margin:10px 0;background:#dfedf2;border-radius:8px;padding:15px;font-size:13px;font-weight:700}.cover-art span:last-child{background:#e5f5e9}.cover-text{position:relative;z-index:1;max-width:67%}.cta{display:inline-flex;align-self:flex-start;margin-top:34px;background:#199b86;color:white;text-decoration:none;padding:15px 24px;border-radius:12px;font-weight:700}.controls{width:min(1200px,90vw);margin:0 auto 22px;display:flex;align-items:center;gap:16px}.controls button{background:white;color:#12334a;border:1px solid #cbdedb;border-radius:11px;padding:11px 17px;font-weight:700}.controls button:disabled{opacity:.4;cursor:default}.progress{height:5px;background:#d6e7e3;border-radius:10px;flex:1;overflow:hidden}.progress span{height:100%;display:block;background:#1a9986;transition:width .25s}.counter{min-width:74px;text-align:center;font-size:13px;color:#526d77;font-weight:700}.kbd{font-size:12px;color:#789097;margin-left:auto}.jump{position:absolute;left:-9999px}.slide:focus{outline:none}.compact .grid{grid-template-columns:repeat(2,1fr)}@media(max-width:700px){.top{height:65px}.topright span{display:none}.frame{padding:18px 16px 12px;align-items:stretch}.slide{min-height:calc(100dvh - 160px);padding:30px 27px;border-radius:20px}.slide h1{font-size:34px}.slide h1.hero{font-size:43px}.cover-text{max-width:100%}.cover-art{display:none}.grid,.compact .grid{grid-template-columns:1fr;gap:20px;padding-top:30px;padding-bottom:20px}.item h2{font-size:19px;margin-bottom:6px}.item p{font-size:15px}.slide .lede{font-size:16px}.slide .note{font-size:13px}.controls{width:calc(100% - 32px);gap:8px;margin-bottom:16px}.controls button{padding:10px 12px}.kbd{display:none}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><div class="shell"><header class="top"><div class="brand"><span class="mark" aria-hidden="true">▤</span><span>EduMate<small>GHANA</small></span></div><div class="topright"><span>School owners presentation</span><a href="https://edumate-ghana.onrender.com" target="_blank" rel="noopener">Explore the app ↗</a></div></header><main class="frame"><section id="slide" class="slide" tabindex="-1" aria-live="polite" aria-label="Presentation slide"></section></main><nav class="controls" aria-label="Presentation controls"><button id="prev" aria-label="Previous slide">← Previous</button><div class="progress" aria-hidden="true"><span id="bar"></span></div><span class="counter" id="counter"></span><button id="next" aria-label="Next slide">Next →</button><span class="kbd">Use ← → arrow keys</span></nav></div><script>
const slides=[
{cover:true,kicker:'A learning platform for Ghanaian private schools',title:'Better learning, within reach.',lede:'A teacher-led digital learning platform for preschool and primary schools.',bottom:'Presented by Ebenezer Kwaw · EduMate Ghana'},
{title:'Keeping learning connected',lede:'Schools need a practical way to bring teaching materials, pupil work and progress together.',items:[['Teachers','Prepare lessons, share resources and follow up on work.'],['Pupils','Need clear activities they can continue outside the classroom.'],['School leaders','Need a clear picture of participation and progress.']]},
{title:'One platform for the school community',lede:'EduMate brings school learning activities together on compatible devices.',items:[['School setup','Create classes, subjects, terms and accounts.'],['Teachers and pupils','Teachers publish lessons; pupils read, practise and complete work.'],['Leaders and parents','Review reports and share appropriate progress with parents.']]},
{title:'Give pupils more ways to learn',lede:'A pupil can follow a teacher’s lesson, practise and show their work.',items:[['Learn','Access school lessons and primary content in Mathematics, English and Science.'],['Practise','Use lesson practice and work through assigned assessments.'],['Show work','Save drafts and attach photos of handwritten work.']],note:'Teachers remain central to instruction and feedback.'},
{title:'EduMate Kids brings learning to preschool',lede:'A teacher-guided experience for Nursery, KG 1 and KG 2.',items:[['Play and explore','Sample activities introduce colours, counting, animals and healthy habits.'],['Learn together','Teachers and parents guide children with conversation and classroom activities.'],['Build school lessons','Create preschool classes and publish age-appropriate lessons for each class.']],note:'Four sample activities demonstrate the experience and do not record pupil progress.'},
{title:'Teachers can add videos to lessons',lede:'Schools choose and review content for their learners.',items:[['Upload a video','Attach an MP4 the school owns or has permission to use.'],['Share a YouTube link','Add a teacher-selected video for online viewing.'],['Review before viewing','A school administrator reviews videos before pupils can see them.']],note:'Downloaded MP4s can play offline. YouTube videos need an internet connection.'},
{title:'Teachers can use materials they already have',lede:'Build lessons around the school’s teaching plan.',items:[['Organise','Use term, week, strand, sub-strand and learning objectives.'],['Attach','Add worksheets, slides, images and reviewed lesson videos.'],['Follow up','Set assignments and return feedback to learners.']],note:'Content should receive educator review before use.'},
{title:'Learning can continue when the internet is unreliable',lede:'Prepare lessons and resources while connected.',items:[['Prepare online','Sign in, then download lessons and approved videos to the device.'],['Work offline','Read, watch downloaded videos, practise and draft answers.'],['Reconnect','Queued work synchronises when a connection returns.']],note:'The school should use a separate managed browser profile for each learner.'},
{title:'See where support is needed',lede:'Reports turn classroom activity into information for follow-up.',items:[['Participation','Review lesson and assignment completion.'],['Performance','See released class averages and learner results.'],['Follow-up','Identify pupils flagged for support and export PDF or CSV.']],note:'Use reports alongside teacher judgement.'},
{title:'Parents can follow their child’s progress',lede:'The school links each parent account to the appropriate learner.',items:[['What is due','See outstanding assignments for the current class.'],['What was learned','Review completed lessons and released results.'],['Teacher feedback','Read feedback when the school releases it.']],note:'Parents sign in to view summaries. Automatic messages are not yet enabled.'},
{title:'A school tablet package shaped around your needs',lede:'The platform can be installed as a web app on a compatible tablet.',items:[['School setup','Agree the classes, subjects, accounts and initial content.'],['Device planning','Confirm tablet models, quantities and deployment requirements.'],['Getting started','Plan teacher onboarding and a manageable first rollout.']],note:'Device supply, specifications and support are confirmed in the school proposal.'},
{title:'A tutor experience is being prepared for the future',lede:'The current interface demonstrates how guided support could work.',items:[['Available in the demo','Lesson-linked prompts, prepared hints, practice and revision guidance.'],['Planned for later','Connect a GPT API through a protected backend, with appropriate safeguards.']],note:'Current responses are scripted. GPT is not connected.'},
{title:'Start with a small, measurable pilot',lede:'An illustrative 4–6 week pilot can help the school evaluate fit.',items:[['Plan and prepare','Choose a class and lead teacher, set up accounts and review content.'],['Use in class','Teachers introduce lessons and assignments to pupils.'],['Review together','Discuss usage, completion and teacher feedback.']],note:'The pilot timeline and measures can be adapted to the school.'},
{title:'A responsible rollout starts with clear agreements',lede:'The school and EduMate should agree the details before using real pupil data.',items:[['Access','School-managed accounts and appropriate permissions.'],['Devices','Separate managed profiles and a plan for offline data.'],['Support','Agree content review, onboarding and privacy arrangements.']],note:'Android kiosk management requires a separate integration.'},
{end:true,kicker:'LET’S TALK',title:'Let’s explore what EduMate can do for your school.',lede:'Request a demonstration and discuss a pilot designed around your classes.',bottom:'Presented by Ebenezer Kwaw · EduMate Ghana'}
];
const el=document.getElementById('slide'),prev=document.getElementById('prev'),next=document.getElementById('next'),bar=document.getElementById('bar'),counter=document.getElementById('counter');let current=0;
function render(focus=false){const s=slides[current];el.className='slide'+(s.cover||s.end?' dark':'')+(s.items&&s.items.length===2?' compact':'');el.setAttribute('aria-label',`Slide ${current+1} of ${slides.length}`);let content=`<div class="${s.cover?'cover-text':''}"><div class="kicker">${s.kicker||'EDUMATE GHANA'}</div><h1 class="${s.cover?'hero':''}">${s.title}</h1><p class="lede">${s.lede}</p></div>`;if(s.cover)content+=`<div class="pill">Teacher-led · Tablet-ready</div><div class="cover-art" aria-label="Concept illustration of a learning tablet"><b>EduMate</b><h3>My learning</h3><span>Mathematics<br><small>Lesson and practice</small></span><span>My assignments</span></div>`;if(s.items)content+=`<div class="grid">${s.items.map(([h,p])=>`<div class="item"><h2>${h}</h2><p>${p}</p></div>`).join('')}</div>`;if(s.note)content+=`<p class="note">${s.note}</p>`;if(s.end)content+=`<a class="cta" href="https://edumate-ghana.onrender.com/#demo" target="_blank" rel="noopener">Request a school demonstration ↗</a>`;if(s.bottom)content+=`<p class="cover-bottom">${s.bottom}</p>`;el.innerHTML=content;counter.textContent=`${String(current+1).padStart(2,'0')} / ${String(slides.length).padStart(2,'0')}`;bar.style.width=`${(current+1)/slides.length*100}%`;prev.disabled=current===0;next.disabled=current===slides.length-1;history.replaceState(null,'','#slide-'+(current+1));if(focus)el.focus()}
function move(n){const target=Math.max(0,Math.min(slides.length-1,n));if(target!==current){current=target;render()}}prev.addEventListener('click',()=>move(current-1));next.addEventListener('click',()=>move(current+1));document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();move(current+1)}if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();move(current-1)}if(e.key==='Home'){e.preventDefault();move(0)}if(e.key==='End'){e.preventDefault();move(slides.length-1)}});const match=location.hash.match(/^#slide-(\d+)$/);if(match)current=Math.min(slides.length-1,Math.max(0,Number(match[1])-1));render();
</script></body></html>
